<title>{{TITLE}}</title>
<style>
body{margin:0;overflow:hidden;user-select:none;font:12px sans-serif}
#c{position:relative;--p:50;width:100%;aspect-ratio: {{AR}};overflow:hidden;background:#111;touch-action: pan-y}
#ib{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#k{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*1%);overflow:hidden;box-shadow:2px 0 #fff,2px 0 4px #0007}
#k img{position:absolute;left:0;top:0;height:100%;max-width:none}
#b{position:absolute;top:50%;left:calc(var(--p)*1%);width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 1px 6px #0007;font:16px/34px sans-serif;text-align:center;color:#333}
#ta,#tb,#h{position:absolute;padding:3px 7px;border-radius:7px;background:#0008;color:#fff}
#ta,#tb{top:8px;font-weight:600}
#ta{left:8px}#tb{right:8px}
#h{left:8px;bottom:8px}
#c.on #h{opacity:0}
</style>
<div id=c>
<img id=ib src="{{B}}" {{SIZE}}>
<div id=k><img id=ia src="{{A}}" {{SIZE}}></div>
<div id=b>↔</div>
<b id=ta>{{LABEL_A}}</b>
<b id=tb>{{LABEL_B}}</b>
<span id=h>{{HINT}}</span>
</div>
<script>
(function(){
var W=window.TelegramWidget,c=document.getElementById('c'),ib=document.getElementById('ib'),ia=document.getElementById('ia'),L=null,p=.5,z=.5,r;
function q(v){return Math.min(1,Math.max(0,v))}
try{L=localStorage;s=L.getItem('cmp');if(s!==null)p=q(+s)}catch(e){}
function f(){
c.style.setProperty('--p',p*100);
if(W&&Math.abs(p-z)>.04){z=p;try{W.HapticFeedback.selectionChanged()}catch(e){}}
}
function sz(){var b=c.getBoundingClientRect();if(!(b.width>0))return;ib.style.width=ia.style.width=b.width+'px';ib.style.height=ia.style.height=b.height+'px'}
function m(e){p=q((e.clientX-r.l)/r.w);f()}
c.onpointerdown=function(e){
var b=c.getBoundingClientRect();if(!(b.width>0))return;
sz();r={i:e.pointerId,l:b.left,w:b.width,p:p};c.className='on';
try{c.setPointerCapture(e.pointerId)}catch(x){}
m(e);
};
c.onpointermove=function(e){if(r&&e.pointerId===r.i)m(e)};
c.onpointerup=function(){if(!r)return;try{L.setItem('cmp',''+p)}catch(x){}f();r=null};
c.onpointercancel=function(){if(!r)return;p=r.p;f();r=null};
f();sz();requestAnimationFrame(sz);
if(W)W.ready();
})();
</script>

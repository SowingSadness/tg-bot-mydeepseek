<title>{{TITLE}}</title>
<style>
  body { margin: 0; overflow: hidden; -webkit-user-select: none; user-select: none;
         font: 12px/1.1 system-ui, sans-serif; color: var(--tg-theme-text-color, #fff); }
  #c { position: relative; width: 100%; aspect-ratio: {{AR}}; overflow: hidden;
       background: var(--tg-theme-secondary-bg-color, #111); touch-action: pan-y; cursor: ew-resize; }
  #c img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #k { position: absolute; inset: 0; width: calc(var(--p) * 1%); overflow: hidden; }
  #k img { width: calc(100% / var(--pn)); }
  #b { position: absolute; top: 0; bottom: 0; left: calc(var(--p) * 1%); width: 2px; margin-left: -1px;
       background: #fff; box-shadow: 0 0 6px rgba(0, 0, 0, .45); pointer-events: none; }
  #n { position: absolute; top: 50%; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
       border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .45); }
  #n::before, #n::after { content: ''; position: absolute; top: 11px; width: 0; height: 0;
       border: 6px solid transparent; border-top-width: 6px; border-bottom-width: 6px; }
  #n::before { left: 0; border-right-color: #333; }
  #n::after { right: 0; border-left-color: #333; }
  .t { position: absolute; top: 8px; padding: 3px 7px; border-radius: 7px; background: rgba(0, 0, 0, .55);
       font-weight: 600; letter-spacing: .02em; }
  #ta { left: 8px } #tb { right: 8px }
  #h { position: absolute; left: 8px; bottom: 8px; padding: 3px 7px; border-radius: 7px;
       background: rgba(0, 0, 0, .45); transition: opacity .4s ease; }
  #c.on #h { opacity: 0 }
</style>
<div id="c">
  <img id="ib" src="{{B}}" alt="">
  <div id="k"><img id="ia" src="{{A}}" alt=""></div>
  <div id="b"><div id="n"></div></div>
  <span class="t" id="ta">{{LABEL_A}}</span>
  <span class="t" id="tb">{{LABEL_B}}</span>
  <span id="h">{{HINT}}</span>
</div>
<script>
(function () {
  var TW = window.TelegramWidget, c = document.getElementById('c'), d = document.documentElement;
  var p = 0.5, press = null, buzzed = 0.5;
  try { var s = localStorage.getItem('cmp'); if (s !== null) p = Math.min(1, Math.max(0, +s)); } catch (e) {}
  function draw() {
    d.style.setProperty('--p', (p * 100).toFixed(2));
    d.style.setProperty('--pn', Math.max(p, 0.02).toFixed(4));
  }
  function buzz(v) {
    if (Math.abs(v - buzzed) < 0.04 || !TW) return;
    buzzed = v;
    try { TW.HapticFeedback.selectionChanged(); } catch (e) {}
  }
  function set(e) {
    p = Math.min(1, Math.max(0, (e.clientX - press.r.left) / press.r.width));
    draw();
    buzz(p);
  }
  c.addEventListener('pointerdown', function (e) {
    var r = c.getBoundingClientRect();
    if (!(r.width > 0)) return;
    press = { id: e.pointerId, r: r, was: p };
    c.className = 'on';
    try { c.setPointerCapture(e.pointerId); } catch (x) {}
    set(e);
  });
  c.addEventListener('pointermove', function (e) { if (press && e.pointerId === press.id) set(e); });
  function end(e) {
    if (!press) return;
    if (e.type === 'pointercancel') { p = press.was; draw(); }
    else { try { localStorage.setItem('cmp', String(p)); } catch (x) {} }
    press = null;
  }
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  draw();
  if (TW) TW.ready();
})();
</script>
